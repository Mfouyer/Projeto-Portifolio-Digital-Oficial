server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback — todas as rotas caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache leve para assets com hash
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
